ShortDescription: Modern Windows 11 system tray battery monitor for 2.4GHz wireless dongles, Bluetooth peripherals, and gaming gear.
Description: |-
  Battery Indicator is a sleek, native Windows 11 system tray utility designed to monitor battery telemetry across all your wireless peripherals:
  - 2.4GHz wireless gaming mice (Logitech Lightspeed, Razer HyperSpeed, ATK/VXE, Glorious, etc.)
  - Wireless mechanical keyboards (Keychron, NuPhy, Akko, Epomaker, Portronics)
  - Bluetooth True Wireless Stereo (TWS) earbuds with Left & Right bud telemetry
  - Bluetooth headphones, styluses, and speakers
  - Xbox Wireless Controllers, DualSense, DualShock 4, and Nintendo Switch controllers
  - Uninterruptible Power Supplies (APC, CyberPower UPS)
  - Custom crowdsourced JSON device profiles for zero-code community additions
  - Customizable global summon hotkey (Default: Win + Alt + B)
  - Dedicated circular battery gauges pinned directly to your taskbar system tray
  - 100% Telemetry-Free local crash logging and privacy protection
